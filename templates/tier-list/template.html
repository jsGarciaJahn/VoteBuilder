<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <style>{{CSS}}</style>
  </head>
  <body>
    <main>
      <div class="panel">
        <h1>{{TITLE}}</h1>
        <div id="setup">
          <label for="voterName">Your name</label>
          <input id="voterName" type="text" placeholder="Enter your name" />
          <button id="startBtn">Start tier voting</button>
        </div>
        <div id="ballot" hidden>
          <h2>Assign each candidate to a tier</h2>
          <div class="tier-list" id="tierList"></div>
          <div class="grid" id="cardGrid"></div>
          <button id="copyBtn">Copy results</button>
        </div>
      </div>
    </main>
    <script>
      const ballotData = {{DATA}};
    </script>
    <script>{{JS}}</script>
  </body>
</html>
