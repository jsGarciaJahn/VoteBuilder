<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoteBuilder</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/mobile.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <div class="page-header">
          <div class="page-title-group">
            <h1>VoteBuilder</h1>
          </div>
          <div class="header-actions">
            <div class="tabs" role="tablist" aria-label="Builder views">
              <button type="button" class="tab active" data-tab="configure" role="tab" aria-selected="true">Configure</button>
              <button type="button" class="tab" data-tab="preview" role="tab" aria-selected="false">Preview</button>
              <button type="button" class="tab" data-tab="publish" role="tab" aria-selected="false">Publish</button>
            </div>
          </div>
        </div>

        <div class="app-menu-row" aria-label="Application menu">
          <details class="file-menu" id="fileMenu">
            <summary>File</summary>
            <div class="file-menu-popover" role="menu" aria-label="File menu">
              <button id="newWorkspaceBtn" type="button" role="menuitem">New</button>
              <button id="saveWorkspaceBtn" type="button" role="menuitem">Save</button>
              <button id="saveWorkspaceAsBtn" type="button" role="menuitem">Save As</button>
              <button id="loadWorkspaceBtn" type="button" role="menuitem">Load</button>
            </div>
          </details>
          <input id="workspaceFileInput" type="file" accept=".bcd,application/octet-stream,application/json" hidden />
        </div>

        <section id="configurePanel" role="tabpanel">
          <div class="config-box">
            <div class="field-row">
              <label for="contestTitle" class="field-label">Contest title</label>
              <div class="field-control"><input id="contestTitle" type="text" /></div>
            </div>

            <div class="field-row" id="bannerRow">
              <label for="bannerImageInput" class="field-label">Top banner</label>
              <div class="field-control banner-control">
                <input id="bannerImageInput" type="file" accept="image/*" />
                <div id="bannerPreview" class="banner-preview" hidden></div>
                <button id="clearBannerBtn" class="secondary small" type="button" hidden>Remove banner</button>
              </div>
            </div>

            <div class="field-row">
              <label for="votingMode" class="field-label">Ballot mode</label>
              <div class="field-control"><select id="votingMode">
                <option value="ranked-choice">Ranked choice</option>
                <option value="tier-list">Tier list</option>
                <option value="pairwise">Pairwise</option>
              </select></div>
            </div>

            <div class="field-row">
              <label for="sortMode" class="field-label">Ordering</label>
              <div class="field-control"><select id="sortMode">
                <option value="builder">As configured in builder</option>
                <option value="alpha">Alphabetical</option>
                <option value="random">Randomize on open</option>
              </select></div>
            </div>

            <div class="field-row" id="pairwiseAlgorithmRow" hidden>
              <label for="pairwiseAlgorithm" class="field-label">Pairwise algorithm</label>
              <div class="field-control"><select id="pairwiseAlgorithm">
                <option value="winner-stays">Winner stays</option>
                <option value="loser-stays">Loser stays</option>
                <option value="full-random">Full random picks</option>
                <option value="tournament-losers-bracket">Tournament with losers bracket</option>
              </select></div>
            </div>

            <div class="field-row" id="tierSettingsRow" hidden>
              <label for="tierLabelsEditor" class="field-label">Tiers</label>
              <div class="field-control">
                <div id="tierLabelsEditor" class="tier-labels-editor"></div>
                <button id="addTierBtn" class="secondary small" type="button">+ Add tier</button>
              </div>
            </div>

            <div class="field-row checkbox-row" id="enableExclusionRow">
              <label for="enableExclusion" class="field-label">Allow one exclusion</label>
              <div class="field-control checkbox-control"><input id="enableExclusion" type="checkbox" /></div>
            </div>

            <div class="field-row checkbox-row" id="nameSettings">
              <label for="promptForName" class="field-label">Prompt for voter name</label>
              <div class="field-control checkbox-control"><input id="promptForName" type="checkbox" /></div>
            </div>

            <div class="field-row" id="completionOptions">
              <label for="completionRuleMode" class="field-label">Completion rule</label>
              <div class="field-control"><select id="completionRuleMode">
                <option value="all-ranked">Require all ranked entries</option>
                <option value="at-least-one">Require at least one ranked entry</option>
                <option value="minimum-count">Require a minimum number of ranked entries</option>
                <option value="exact-count">Require an exact number of ranked entries</option>
              </select></div>
            </div>

            <div class="field-row" id="completionRuleCountRow">
              <label for="completionRuleCount" class="field-label">Required count</label>
              <div class="field-control"><input id="completionRuleCount" type="number" min="1" /></div>
            </div>

            <div class="field-row" id="completionLabelRow">
              <label for="completionLabel" class="field-label">Completion label</label>
              <div class="field-control"><input id="completionLabel" type="text" /></div>
            </div>

            <div class="field-row">
              <label for="ballotTheme" class="field-label">Ballot theme</label>
              <div class="field-control"><select id="ballotTheme">
                <option value="default">Default</option>
              </select></div>
            </div>

            <div class="field-row">
              <label for="candidateCardVariant" class="field-label">Candidate card variant</label>
              <div class="field-control"><select id="candidateCardVariant">
                <option value="default">Default</option>
                <option value="compact">Compact</option>
                <option value="poster">Poster</option>
                <option value="minimal">Minimal</option>
              </select></div>
            </div>

            <div class="field-row">
              <label for="candidateCardCycleSeconds" class="field-label">Image cycle (seconds)</label>
              <div class="field-control"><input id="candidateCardCycleSeconds" type="number" min="1.8" max="15" step="0.1" value="4.5" /></div>
            </div>

            <div class="field-row">
              <label for="candidateCardSwipeMs" class="field-label">Swipe speed (ms)</label>
              <div class="field-control"><input id="candidateCardSwipeMs" type="number" min="180" max="900" step="10" value="420" /></div>
            </div>

            <div class="field-row">
              <label for="candidateCardCycleVarianceMs" class="field-label">Cycle variance (ms)</label>
              <div class="field-control"><input id="candidateCardCycleVarianceMs" type="number" min="0" max="5000" step="50" value="900" /></div>
            </div>

            <div class="field-row">
              <label for="candidateCardImageHeight" class="field-label">Image height (px)</label>
              <div class="field-control"><input id="candidateCardImageHeight" type="number" min="110" max="260" step="5" value="150" /></div>
            </div>
          </div>

          <div class="builder-workspace">
            <section class="asset-stage">
              <div class="section-heading">
                <h2>
                  Upload & images
                  <span class="help-icon" title="Drop photos here, then drag them into candidate cards">?</span>
                </h2>
                <div class="section-actions">
                  <button id="autoCreateBtn" class="secondary" type="button">Batch add</button>
                  <button id="clearPoolBtn" class="secondary" type="button">Clear pool</button>
                </div>
              </div>
              <div class="asset-workspace">
                <div id="imagePool" class="image-pool drop-zone" role="button" tabindex="0" aria-label="Image pool"></div>
                <input id="fileInput" type="file" accept="image/*" multiple hidden />
              </div>
            </section>

            <section class="pool-section candidate-stage">
              <div class="section-heading">
                <h2>
                  Candidates
                  <span class="help-icon" title="Drop an image here to create a new candidate or add one to an existing card">?</span>
                </h2>
                <div class="section-actions">
                  <label class="checkbox-pill compact-toggle">
                    <input id="useImageNameForCandidateTitle" type="checkbox" />
                    Use image name as title
                  </label>
                  <button id="addCandidateBtn" class="secondary" type="button">+ Candidate</button>
                </div>
              </div>
              <div id="candidatesList" class="candidate-list"></div>
            </section>
          </div>
        </section>

        <section id="previewPanel" role="tabpanel" hidden>
          <div class="preview-shell">
            <div class="preview-footer">
              <div class="preview-toolbar-actions">
                <label class="viewport-toggle" for="previewMobileToggle" aria-label="Preview viewport mode">
                  <span class="viewport-label">Desktop</span>
                  <input id="previewMobileToggle" type="checkbox" aria-label="Toggle mobile preview" />
                  <span class="viewport-track" aria-hidden="true"><span class="viewport-thumb"></span></span>
                  <span class="viewport-label">Mobile</span>
                </label>
                <button type="button" id="refreshPreviewBtn" class="secondary">Refresh preview</button>
              </div>
            </div>
            <div id="previewFrame" class="preview-frame"></div>
          </div>
        </section>

        <section id="publishPanel" role="tabpanel" hidden>
          <div class="ballot-size-meter publish-meter" aria-live="polite" aria-label="Ballot size progress">
            <div class="ballot-size-meter-topline">
              <strong>Ballot size</strong>
              <span id="ballotSizeLabel">0 KB / 2 MB</span>
            </div>
            <div class="ballot-size-track" aria-hidden="true">
              <div id="ballotSizeFill" class="ballot-size-fill"></div>
            </div>
            <small id="ballotSizeHint">Includes candidate images, descriptions, generated CSS, and ballot logic.</small>
          </div>

          <div class="publish-shell">
            <h2>Publish</h2>
            <p>Download the generated ballot HTML or use the preview tab to inspect the current version.</p>
            <div class="toolbar">
              <button id="publishGenerateBtn" class="primary">Generate ballot</button>
            </div>
          </div>
        </section>

        <footer class="builder-brand-footer" aria-label="Builder attribution">
          <img id="builderFooterLogo" alt="Juan Solo logo" hidden />
          <small id="builderFooterText">made with AI by Juan Solo</small>
        </footer>
      </section>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
